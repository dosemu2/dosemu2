name: Test Suite (Triggered)

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/devel' }}

on:
  push:
    branches-ignore:
      - 'claude/kvm-stand*'

  pull_request:
    types:
      - opened
      - reopened
      - synchronize

# workflow_dispatch:

jobs:
  triggered:
    name: "Test Suite (standard-${{ (github.event_name == 'push' && github.repository_owner == 'dosemu2' && github.ref_name == 'devel') && 'simple' || 'normal' }}-ubuntu-24.04)"
    uses: ./.github/workflows/test-suite-worker.yml
    with:
      bldtype: 'standard'
      runtype: ${{ (github.event_name == 'push' && github.repository_owner == 'dosemu2' && github.ref_name == 'devel') && 'simple' || 'normal' }}
      os: 'ubuntu-24.04'
