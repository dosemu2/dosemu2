name: Claude

# Hand "@claude" to the project's Claude sessions, in an issue or in a
# pull request alike.

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

jobs:
  notify:
    if: |
      github.repository_owner == 'dosemu2' &&
      (
        (github.event_name == 'issue_comment' &&
         contains(github.event.comment.body, '@claude') &&
         contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'issues' &&
         (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
         contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      ROUTINE_ID: trig_01W12PMjrKPCMpSULVm94Sux
      ROUTINE_TOKEN: ${{ secrets.CLAUDE_ROUTINE_TOKEN }}
      URL: ${{ github.event.comment.html_url || github.event.issue.html_url }}
      AUTHOR: ${{ github.event.comment.user.login || github.event.issue.user.login }}
      BODY: ${{ github.event.comment.body || github.event.issue.body }}
      COMMENT_ID: ${{ github.event.comment.id }}
      ISSUE: ${{ github.event.issue.number }}
    steps:
      - name: React
        run: |
          if [ -n "$COMMENT_ID" ]; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID/reactions" -f content=eyes
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$ISSUE/reactions" -f content=eyes
          fi

      - name: Wake the project
        run: |
          jq -n --arg text "$URL
          author: $AUTHOR

          $BODY" '{text: $text}' |
          curl -sS --fail-with-body -X POST \
            "https://api.anthropic.com/v1/claude_code/routines/$ROUTINE_ID/fire" \
            -H "Authorization: Bearer $ROUTINE_TOKEN" \
            -H "anthropic-version: 2023-06-01" \
            -H "anthropic-beta: experimental-cc-routine-2026-04-01" \
            -H "Content-Type: application/json" \
            --data-binary @-
